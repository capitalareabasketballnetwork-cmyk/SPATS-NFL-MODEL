name: Refresh historical NFL betting odds
on:
  workflow_dispatch:
  schedule:
    - cron: "30 12 * * 2"
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas requests
      - run: python scripts/update_historical_odds.py
      - name: Commit updated odds and coverage
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/web/nfl_historical_odds.csv.gz reports/odds_coverage.csv
          git diff --cached --quiet || (git commit -m "Refresh historical NFL closing odds" && git push)
