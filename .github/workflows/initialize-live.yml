name: Initialize SPATS Live
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  initialize:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build historical data once
        run: python scripts/build_database.py --start 1999 --end 2026
      - name: Freeze exact SPATS V1 parameters
        run: python scripts/export_live_bootstrap.py
      - name: Create first live snapshot
        run: python scripts/update_spats_live.py
      - name: Save compact live state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live/
          git diff --cached --quiet || git commit -m "Initialize SPATS Live"
          git pull --rebase origin main
          git push
