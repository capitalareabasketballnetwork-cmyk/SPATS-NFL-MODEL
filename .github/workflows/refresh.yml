name: Refresh SPATS database
on:
  workflow_dispatch:
    inputs:
      start:
        description: First season
        required: false
        default: "1999"
  push:
    branches: [main]
    paths:
      - ".github/workflows/refresh.yml"
      - "scripts/**"
      - "src/**"
      - "config/**"
      - "requirements.txt"
  schedule:
    - cron: "45 10 * 9-12,1-2 2,5"
permissions:
  contents: write
concurrency:
  group: spats-refresh-main
  cancel-in-progress: true
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build
        run: python scripts/build_database.py --start ${{ inputs.start || '1999' }} --end 2026
      - run: python scripts/validate_database.py
      - run: python scripts/train_baselines.py
      - name: Optimize winner statistics and weights
        run: python scripts/optimize_winner_model.py
      - name: Predict 2026 Week 3
        run: python scripts/predict_week3_2026.py
      - name: Commit compact reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/
          git diff --cached --quiet || git commit -m "Refresh SPATS coverage and backtests"
          git pull --rebase origin main
          git push
