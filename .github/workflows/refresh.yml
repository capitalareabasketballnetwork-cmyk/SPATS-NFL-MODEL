name: SPATS Research Rebuild
on:
  workflow_dispatch:
    inputs:
      start:
        description: First season
        required: false
        default: "1999"
permissions:
  contents: write
concurrency:
  group: spats-research
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build historical database
        run: python scripts/build_database.py --start ${{ inputs.start || '1999' }} --end 2026
      - name: Validate historical database
        run: python scripts/validate_database.py
      - name: Train research baselines
        run: python scripts/train_baselines.py
      - name: Optimize research model
        run: python scripts/optimize_winner_model.py
      - name: Commit research reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/
          git diff --cached --quiet || git commit -m "Refresh SPATS research reports"
          git pull --rebase origin main
          git push
