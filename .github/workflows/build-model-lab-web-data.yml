name: Build Model Lab Web Data
# Builds the compact dataset consumed by the hosted Streamlit app.

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-model-lab-web-data.yml"

permissions:
  contents: write

jobs:
  build-web-data:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Build historical database
        run: python scripts/build_database.py --start 2015 --end 2026
      - name: Export compact website dataset
        run: python scripts/export_model_lab_web_data.py
      - name: Commit compact dataset
        run: |
          # Preserve only the two permanent website datasets. The historical
          # database build is a one-time source step, not something Streamlit reruns.
          mkdir -p /tmp/model-lab-web
          cp data/web/model_lab_team_games.csv.gz /tmp/model-lab-web/
          cp data/web/model_lab_games.csv.gz /tmp/model-lab-web/

          # Reset all temporary/raw/curated files created by the build so they
          # cannot be duplicated or accidentally committed.
          git reset --hard HEAD
          git clean -fd

          # Move to the newest main in case another website commit landed while
          # the one-time data build was running.
          git fetch origin main
          git reset --hard origin/main

          mkdir -p data/web
          cp /tmp/model-lab-web/model_lab_team_games.csv.gz data/web/
          cp /tmp/model-lab-web/model_lab_games.csv.gz data/web/

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/web/model_lab_team_games.csv.gz data/web/model_lab_games.csv.gz

          if git diff --cached --quiet; then
            echo "Permanent website dataset is already current."
          else
            git commit -m "Store permanent Model Lab dataset"
            git push origin HEAD:main
          fi
