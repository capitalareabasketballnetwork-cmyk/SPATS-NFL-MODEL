name: Build Model Lab Web Data

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-model-lab-web-data.yml"

permissions:
  contents: write

jobs:
  build-web-data:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Build historical database
        run: python scripts/build_database.py --start 2015 --end 2026
      - name: Export compact website dataset
        run: python scripts/export_model_lab_web_data.py
      - name: Commit compact dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/web/model_lab_team_games.csv.gz data/web/model_lab_games.csv.gz
          if git diff --cached --quiet; then
            echo "Web dataset is already current."
          else
            git commit -m "Update Model Lab web dataset"
            git push
          fi
