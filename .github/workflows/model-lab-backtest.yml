name: SPATS Model Lab Backtest

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pandas numpy pyarrow

      - name: Run Model Lab backtest
        run: python scripts/backtest_model_lab.py

      - name: Show summary
        if: always()
        run: |
          echo "=== MODEL LAB SUMMARY ==="
          if [ -f reports/model_lab_summary.csv ]; then
            cat reports/model_lab_summary.csv
          else
            echo "Summary file was not created."
          fi

      - name: Upload Model Lab results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-lab-results
          path: |
            reports/model_lab_results.csv
            reports/model_lab_summary.csv
          if-no-files-found: warn
          retention-days: 30
