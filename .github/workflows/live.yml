name: Refresh SPATS Live
on:
  workflow_dispatch:
  schedule:
    - cron: "30 6 * 9-12,1-2 2,5"
    - cron: "30 6 * 9-12,1-2 1"
permissions:
  contents: write
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/update_spats_live.py
      - name: Save live query files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live/
          git diff --cached --quiet || git commit -m "Refresh SPATS Live"
          git pull --rebase origin main
          git push
